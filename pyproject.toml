[build-system]
requires = ["hatchling>=1.21", "hatch-requirements-txt>=0.4.1"]
build-backend = "hatchling.build"

[project]
name = "hp-scanner"
# Version comes from VERSION; runtime/dev deps from requirements.txt / requirements-dev.txt.
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Scan color PNGs and document PDFs from an HP All-in-One over HP LEDM or eSCL (AirScan)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Scott Smith" }]
keywords = ["hp", "scanner", "escl", "airscan", "officejet", "pdf", "png"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
[project.scripts]
hpscan = "hp_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/VirtuallyScott/HP_Scanner_App"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\d+\\.\\d+\\.\\d+)\\s*$"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/hp_scanner"]

[tool.hatch.build.targets.sdist]
include = [
    "Makefile",
    "README.md",
    "VERSION",
    "pyproject.toml",
    "requirements-dev.txt",
    "requirements.txt",
    "scripts",
    "src/hp_scanner",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
