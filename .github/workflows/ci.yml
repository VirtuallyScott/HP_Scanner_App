name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Test with coverage
        run: pytest --cov=hp_scanner --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build wheel and sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Read version
        id: version
        run: echo "version=$(python scripts/bump_version.py none --dry-run)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python -m build

      - name: Check distributions
        run: |
          twine check dist/*
          python scripts/verify_wheel.py dist/*.whl

      - name: Install wheel in a clean venv
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/pip check
          /tmp/smoke/bin/python -c "import PIL, requests, hp_scanner"
          test "$(/tmp/smoke/bin/hpscan --version)" = "hpscan $VERSION"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: hp-scanner-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
